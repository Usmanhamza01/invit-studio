function decodeTemplate(){
  const bin=atob(TEMPLATE_B64); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

// récupère le slug depuis l'URL : /aissatou-moussa  ou  ?s=aissatou-moussa
function getSlug(){
  const q=new URLSearchParams(location.search).get("s");
  if(q) return q.trim();
  const p=location.pathname.replace(/^\/+|\/+$/g,"");
  // ignore les fichiers connus
  if(!p || p.endsWith(".html") || p==="index") return "";
  return decodeURIComponent(p.split("/").pop());
}

// transforme les chemins d'images relatifs en absolus (pour l'iframe)
function absolutize(data){
  if(data && data.fond === "assets/ivoire-cover.webp"){ data.fond = "assets/ivoire-gatefold2.webp"; } // migration ancienne image
  ["cover","fond","introImg"].forEach(k=>{
    if(data[k] && data[k].indexOf("assets/")===0) data[k]="/"+data[k];
  });
  return data;
}

function showError(){ document.getElementById("load").style.display="none"; document.getElementById("err").style.display="flex"; }

function render(data){
  data=absolutize(data);
  const html=decodeTemplate().replace("<body>","<body>\n<script>window.INVITATION_DATA="+JSON.stringify(data)+";<\/scr"+"ipt>");
  const f=document.getElementById("frame");
  f.onload=function(){ document.getElementById("load").style.display="none"; };
  f.srcdoc=html;
}

async function load(){
  const slug=getSlug();
  if(!slug){
    // pas de slug = page d'accueil : message convivial
    document.getElementById("load").style.display="none";
    const err=document.getElementById("err");
    err.querySelector("h2").textContent="Invit'Studio";
    err.querySelector("p").innerHTML="Bienvenue. Ouvrez le lien personnel que les mariés vous ont envoyé.<br><br><a href='/app.html' style='color:#C9A44C;'>→ Espace création</a>";
    err.style.display="flex";
    return;
  }
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/invitations?slug=eq."+encodeURIComponent(slug)+"&select=data", {
      headers:{ "apikey":SUPABASE_ANON }
    });
    if(!r.ok) throw new Error("http "+r.status);
    const rows=await r.json();
    if(!rows.length){ showError(); return; }
    render(rows[0].data);
  }catch(e){ showError(); }
}
load();
</script>
